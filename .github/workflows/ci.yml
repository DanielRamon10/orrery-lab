name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python — lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # science is needed too: phase 5's models import scikit-learn, so the test
        # suite does not collect without it.
        run: pip install -e ".[viz,science,dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  generated-data-is-current:
    name: Generated web data matches the Python source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e "."

      # web/src/data/*.generated.* are committed so the site builds without Python.
      # That only stays safe if they are never edited by hand and never left stale.
      #
      # Checked numerically rather than with `git diff`. A byte comparison was the
      # first attempt and it failed on a clean checkout: the fixture stores
      # full-precision floats, and numpy's last bit differs between the runner and
      # a developer machine. IEEE 754 makes no cross-platform bit-identity promise,
      # so the byte check was asserting something untrue. See the script's docstring.
      - name: Check the generated data is current
        run: python scripts/check_generated_data.py

  web:
    name: Web — typecheck, lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests — includes parity against the Python reference
        run: npm run test

      - name: Build
        run: npm run build
