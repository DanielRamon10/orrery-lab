name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs write access to Pages, and id-token to prove where the
# artifact came from.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel so a merge never lands a
# half-published site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # Vite needs to know the sub-path Pages will serve from, which is the
      # repository name. Derived from the checkout rather than hardcoded, so a
      # fork under a different name deploys correctly with no edits.
      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # enablement: true turns Pages on if it is not already, so a fresh fork
      # deploys without anyone having to visit the repository settings first.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
